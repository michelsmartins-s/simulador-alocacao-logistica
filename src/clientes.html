<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macrimar - Clientes e Compradores</title>
    <link rel="stylesheet" href="css/modern-normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-logo">
        <img src="img/MacrimarLogo.webp" alt="">
    </header>

    <div class="header-busca">
        <div class="buscador">
            <input type="text" id="busca-clientes" placeholder="Buscar cliente por nome ou CNPJ/CPF...">
        </div>
    </div>

    <aside class="sidebar">
        <a href="index.html" class="menu-btn">Painel Geral</a>
        <a href="laudos.html" class="menu-btn">Vistorias</a>
        <a href="clientes.html" class="menu-btn ativo">Clientes</a>
    </aside>

    <main class="workspace">
        <section class="painel">
            <div class="painel-header">
                <h2>NOVO CLIENTE / COMPRADOR</h2>
                <div class="header-actions">
                    <button type="button" id="btn-salvar-clientes" class="btn btn-save">Salvar Cliente</button>
                </div>
            </div>

            <form id="form-cliente" class="form-grid">
                <div class="form-grupo">
                    <label for="nome_cliente">Nome / Razão Social</label>
                    <input type="text" id="nome_cliente" placeholder="Ex: BRF S.A." required>
                </div>

                <div class="form-grupo">
                    <label for="cnpj_cpf">CNPJ / CPF</label>
                    <input type="text" id="cnpj_cpf" placeholder="Ex: 01.838.723/001-27" required>
                </div>
            </form>
        </section>

        <section class="lista-processos">
            <div class="lista-header">
                <h2>CLIENTES E COMPRADORES CADASTRADOS</h2>
            </div>

            <table class="tabela-dados">
                <thead>
                    <tr>
                        <th>Nome / Razão Social</th>
                        <th>CPF / CNPJ</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-clientes">
                    <tr>
                        <td colspan="3" class="tabela-vazia">Carregando clientes...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui/clientesUi.js"></script>
</body>
</html>
