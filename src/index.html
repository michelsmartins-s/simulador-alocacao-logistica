<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Macrimar Log - Sistema de Gestão</title>
    <link rel="icon" type="image/webp" href="img/MacrimarLogo.webp">
    <link rel="stylesheet" href="css/modern-normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header-logo">
        <img src="img/MacrimarLogo.webp" alt="Macrimar Gerenciamento Logístico">
    </div>
    
    <header class="header-busca">
        <div class="buscador">
            <img src="img/lupa.png" alt="">
            <input type="text" id="busca-geral" placeholder="Buscar processo, DUIMP ou container...">
        </div>
    </header>

    <aside class="sidebar">
        <a href="index.html" class="menu-btn ativo">Painel Geral</a>
        <a href="laudos.html" class="menu-btn">Vistorias</a>
        <a href="simulador.html" class="menu-btn">Simulador</a>
    </aside>

    <main class="workspace">
        <section class="painel">
            <div class="painel-header">
                <h2>Novo Processo de Inspeção</h2>
                <div class="header-actions">
                    <label class="checkbox-label">
                        <input type="checkbox" id="check-concluido">
                        Concluído
                    </label>
                    <button type="button" class="btn btn-save" id="btn-salvar-processo">Salvar</button>
                </div>
            </div>

            <form id="form-processo">
                <div class="form-grid">
                    <div class="form-grupo">
                        <label for="numero_inspecao">Nº Relatório</label>
                        <input type="text" id="numero_inspecao" required>
                    </div>
                    <div class="form-grupo">
                        <label for="cliente">Cliente</label>
                        <select id="cliente">
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <div class="form-grupo">
                        <label for="comprador">Comprador</label>
                        <select id="comprador">
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <div class="form-grupo">
                        <label for="vessel">Navio / Viagem (Vessel)</label>
                        <input type="text" id="vessel">
                    </div>
                    <div class="form-grupo">
                        <label for="eta">ETA</label>
                        <input type="date" id="eta">
                    </div>
                    <div class="form-grupo">
                        <label for="booking">Booking / DUIMP / BL</label>
                        <input type="text" id="booking">
                    </div>
                    <div class="form-grupo">
                        <label for="porto_origem">Porto Origem</label>
                        <input type="text" id="porto_origem">
                    </div>
                    <div class="form-grupo">
                        <label for="porto_destino">Porto Destino</label>
                        <input type="text" id="porto_destino">
                    </div>
                    <div class="form-grupo">
                        <label for="fatura_cliente">Fatura Cliente (Invoice)</label>
                        <input type="text" id="fatura_cliente">
                    </div>
                    <div class="form-grupo">
                        <label for="local_inspecao">Local de Inspeção</label>
                        <input type="text" id="local_inspecao">
                    </div>
                </div>

                <div class="secao-containers">
                    <div class="containers-header">
                        <strong>Containers do Processo</strong>
                        <button type="button" class="btn" id="btn-add-container">+ Adicionar Container</button>
                    </div>
                    
                    <div id="lista-containers-form">
                        <div class="container-item">
                            <div class="container-item-header">
                                <span>Container #1</span>
                            </div>
                            <div class="form-grid">
                                <div class="form-grupo">
                                    <label>Nº Container</label>
                                    <input type="text" name="numero_container">
                                </div>
                                <div class="form-grupo">
                                    <label>Tipo</label>
                                    <select name="tipo_container">
                                        <option value="">Selecione...</option>
                                    </select>
                                </div>
                                <div class="form-grupo">
                                    <label>Data Descarregamento</label>
                                    <input type="date" name="data_descarregamento">
                                </div>
                                <div class="form-grupo">
                                    <label>Lacre (Seal)</label>
                                    <input type="text" name="lacre_numero">
                                </div>
                                <div class="form-grupo">
                                    <label>Produto</label>
                                    <input type="text" name="produto_descricao">
                                </div>
                                <div class="form-grupo">
                                    <label>Qnt. Itens (Cases)</label>
                                    <input type="number" name="quantidade_itens">
                                </div>
                                <div class="form-grupo">
                                    <label>Peso (KG)</label>
                                    <input type="number" name="peso_container">
                                </div>
                                <div class="form-grupo">
                                    <label>Observações (Note)</label>
                                    <input type="text" name="observacoes">
                                </div>
                                <div class="form-grupo">
                                    <label>Fotos da Vistoria</label>
                                    <input type="file" name="fotos" accept="image/*" multiple>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </section>

        <section class="lista-processos">
            <div class="lista-header">
                <h2>Processos em Aberto</h2>
            </div>

            <table class="tabela-dados">
                <thead>
                    <tr>
                        <th>Nº Relatório</th>
                        <th>Cliente</th>
                        <th>Navio / DUIMP</th>
                        <th>Containers</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-processos-abertos">
                    <tr>
                        <td colspan="6" class="tabela-vazia">Nenhum processo carregado.</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui/containersUi.js"></script>
    <script src="js/ui/formularioUi.js"></script>
    <script src="js/ui/tabelaUi.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
